<html lang="en"><head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Montserrat:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#22201e;--cream:#fbf8f1;--paper:#fffdf9;--sage:#73856f;--line:#ddd7cb}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Montserrat,Arial,sans-serif;line-height:1.7}
a{color:inherit}
nav{position:fixed;z-index:20;top:0;left:0;right:0;background:rgba(251,248,241,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(34,32,30,.12)}
.nav-inner{max-width:1050px;margin:auto;display:flex;justify-content:center;gap:30px;padding:14px 20px;flex-wrap:wrap}
nav a{text-decoration:none;text-transform:uppercase;letter-spacing:.14em;font-size:10px}
main{max-width:1180px;margin:auto;padding:130px 24px 90px}
.intro{text-align:center;max-width:700px;margin:0 auto 55px}
.kicker{text-transform:uppercase;letter-spacing:.25em;font-size:10px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;line-height:1.05;font-size:64px;margin:12px 0 18px}
.intro p{margin:0;color:#5e5954}
.gallery{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.photo{margin:0;overflow:hidden;background:var(--paper);box-shadow:0 12px 35px rgba(34,32,30,.08);cursor:pointer}
.photo:nth-child(1){grid-column:1/-1}
.photo:nth-child(2){grid-column:1/7}
.photo:nth-child(3){grid-column:7/13}
.photo img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.photo:hover img{transform:scale(1.02)}
.photo:nth-child(1) img{aspect-ratio:16/9}
.photo:nth-child(2) img,.photo:nth-child(3) img{aspect-ratio:4/3}
.back{text-align:center;margin-top:52px}.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:14px 25px;text-transform:uppercase;letter-spacing:.13em;font-size:10px}
footer{text-align:center;padding:40px 20px 50px;font-family:"Cormorant Garamond",Georgia,serif;font-size:28px}.small{font-family:Montserrat,Arial,sans-serif;font-size:11px;color:#777}
.lightbox{position:fixed;inset:0;background:rgba(20,19,18,.94);display:none;align-items:center;justify-content:center;z-index:100;padding:30px}
.lightbox.open{display:flex}.lightbox img{max-width:95vw;max-height:90vh;object-fit:contain}.close{position:absolute;right:24px;top:18px;border:0;background:none;color:white;font-size:36px;cursor:pointer;line-height:1}
@media(max-width:720px){.nav-inner{gap:14px}main{padding-top:115px}h1{font-size:48px}.gallery{display:block}.photo{margin-bottom:18px}.photo img{aspect-ratio:auto!important}}
</style>
</head>
<body>
<nav><div class="nav-inner">

</div></nav>
<main>
  <div class="intro">
    <div class="kicker">Daniel &amp; Maria</div>
    <h1>A few of our favourite moments.</h1>
    <p>A little glimpse of us before we celebrate together in Puerto Rico.</p>
  </div>
  <div class="gallery">
    <figure class="photo"><img src="couple-1.jpg" alt="Daniel and Maria together in front of a traditional gate" loading="eager"></figure>
    <figure class="photo"><img src="couple-2.jpg" alt="Daniel and Maria smiling together in a garden" loading="lazy"></figure>
    <figure class="photo"><img src="couple-3.jpg" alt="Daniel and Maria holding hands in a lush garden" loading="lazy"></figure>
  </div>
  <div class="back"><a class="btn" href="index_with_photos.html">Back to wedding details</a></div>
</main>
<footer>Daniel &amp; Maria<div class="small">November 7, 2027 · Luquillo, Puerto Rico</div></footer>
<div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" aria-label="Close photo">×</button><img src="" alt="Expanded gallery photo"></div>
<script>
const lightbox=document.getElementById('lightbox');
const lightboxImg=lightbox.querySelector('img');
document.querySelectorAll('.photo img').forEach(img=>img.addEventListener('click',()=>{lightboxImg.src=img.src;lightboxImg.alt=img.alt;lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');}));
function closeLightbox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');lightboxImg.src='';}
lightbox.querySelector('.close').addEventListener('click',closeLightbox);
lightbox.addEventListener('click',e=>{if(e.target===lightbox)closeLightbox();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLightbox();});
</script>


</body></html>
